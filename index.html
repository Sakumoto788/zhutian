<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>诸天纪元 · 史诗玄幻巨著</title>

    <!-- 通用字体：思源黑体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet" />

    <style>
        /* ===== 全局重置 ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: #0a0806;
        }

        /* ===== 视频背景 — 调亮 ===== */
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            filter: brightness(1.3) saturate(1.3) contrast(1.1);
        }

        /* ===== 遮罩层 — 通透 ===== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background:
                radial-gradient(ellipse at 50% 45%,
                    rgba(10, 6, 4, 0.05) 0%,
                    rgba(8, 5, 3, 0.12) 25%,
                    rgba(6, 4, 2, 0.25) 50%,
                    rgba(4, 2, 1, 0.50) 75%,
                    rgba(2, 1, 0, 0.80) 100%);
            pointer-events: none;
        }

        /* ===== 高光层 ===== */
        .highlight {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 50% 40%,
                    rgba(255, 220, 180, 0.04) 0%,
                    transparent 60%);
            mix-blend-mode: overlay;
        }

        /* ==========================================================
           排版布局
           ========================================================== */

        .content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 92%;
            max-width: 1200px;
            pointer-events: none;
            margin-top: -2vh;
        }

        .divider-top {
            width: clamp(60px, 8vw, 120px);
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 120, 0.15), transparent);
            margin-bottom: clamp(0.8rem, 2vh, 2rem);
            animation: dividerFade 3s ease-out 1.5s both;
        }

        /* ==========================================================
           主标题 — 鎏金风格 + 通用黑体
           ========================================================== */
        .title {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            font-weight: 900;
            font-size: clamp(5.5rem, 22vw, 15rem);
            letter-spacing: 0.22em;
            line-height: 1.05;
            pointer-events: auto;
            display: block;
            text-align: center;

            background: linear-gradient(180deg,
                    #fff5d0 0%,
                    #f5d68a 12%,
                    #e8b84a 28%,
                    #d4942a 48%,
                    #b87820 62%,
                    #d4942a 78%,
                    #f0c860 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;

            text-shadow:
                0 0 20px rgba(255, 215, 120, 0.35),
                0 0 50px rgba(255, 200, 80, 0.20),
                0 0 100px rgba(255, 180, 60, 0.12),
                0 0 180px rgba(255, 160, 40, 0.06),
                0 4px 20px rgba(0, 0, 0, 0.6),
                0 8px 60px rgba(0, 0, 0, 0.5),
                0 16px 100px rgba(0, 0, 0, 0.4),
                2px 2px 8px rgba(255, 220, 150, 0.08),
                -1px -1px 4px rgba(255, 200, 100, 0.06);

            filter: drop-shadow(0 0 40px rgba(255, 200, 100, 0.08)) drop-shadow(0 0 100px rgba(255, 180, 60, 0.04));

            animation: royalGlow 5s ease-in-out infinite alternate,
                royalFloat 7s ease-in-out infinite alternate;
            transform-origin: center;
            will-change: transform, filter, text-shadow;
        }

        @keyframes royalGlow {
            0% {
                filter: drop-shadow(0 0 30px rgba(255, 200, 100, 0.06)) drop-shadow(0 0 80px rgba(255, 180, 60, 0.03));
                text-shadow: 0 0 15px rgba(255, 215, 120, 0.25), 0 0 40px rgba(255, 200, 80, 0.15), 0 0 80px rgba(255, 180, 60, 0.08), 0 0 160px rgba(255, 160, 40, 0.04), 0 4px 20px rgba(0, 0, 0, 0.6), 0 8px 60px rgba(0, 0, 0, 0.5), 0 16px 100px rgba(0, 0, 0, 0.4), 2px 2px 6px rgba(255, 220, 150, 0.08), -1px -1px 4px rgba(255, 200, 100, 0.06);
            }
            50% {
                filter: drop-shadow(0 0 50px rgba(255, 200, 100, 0.15)) drop-shadow(0 0 120px rgba(255, 180, 60, 0.08)) drop-shadow(0 0 200px rgba(255, 160, 40, 0.04));
                text-shadow: 0 0 30px rgba(255, 215, 120, 0.40), 0 0 60px rgba(255, 200, 80, 0.25), 0 0 120px rgba(255, 180, 60, 0.15), 0 0 200px rgba(255, 160, 40, 0.08), 0 6px 30px rgba(0, 0, 0, 0.7), 0 12px 80px rgba(0, 0, 0, 0.6), 0 20px 120px rgba(0, 0, 0, 0.5), 3px 3px 10px rgba(255, 220, 150, 0.12), -2px -2px 6px rgba(255, 200, 100, 0.10);
            }
            100% {
                filter: drop-shadow(0 0 30px rgba(255, 200, 100, 0.06)) drop-shadow(0 0 80px rgba(255, 180, 60, 0.03));
                text-shadow: 0 0 15px rgba(255, 215, 120, 0.25), 0 0 40px rgba(255, 200, 80, 0.15), 0 0 80px rgba(255, 180, 60, 0.08), 0 0 160px rgba(255, 160, 40, 0.04), 0 4px 20px rgba(0, 0, 0, 0.6), 0 8px 60px rgba(0, 0, 0, 0.5), 0 16px 100px rgba(0, 0, 0, 0.4), 2px 2px 6px rgba(255, 220, 150, 0.08), -1px -1px 4px rgba(255, 200, 100, 0.06);
            }
        }

        @keyframes royalFloat {
            0% {
                transform: translateY(0px);
            }
            100% {
                transform: translateY(-12px);
            }
        }

        .divider-bottom {
            width: clamp(40px, 5vw, 80px);
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 120, 0.12), transparent);
            margin-top: clamp(0.6rem, 1.2vh, 1.2rem);
            margin-bottom: clamp(0.8rem, 1.8vh, 1.8rem);
            animation: dividerFade 3s ease-out 2s both;
        }

        @keyframes dividerFade {
            0% {
                opacity: 0;
                transform: scaleX(0.3);
            }
            100% {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        /* ===== 副标题 — 通用字体 ===== */
        .subtitle {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            font-weight: 300;
            font-size: clamp(0.75rem, 1.4vw, 1.3rem);
            letter-spacing: 0.7em;
            color: rgba(255, 220, 160, 0.30);
            text-shadow:
                0 2px 30px rgba(0, 0, 0, 0.8),
                0 0 60px rgba(0, 0, 0, 0.3);
            opacity: 0;
            animation: subtitleFade 3.5s ease-out 1.2s forwards;
            pointer-events: auto;
            text-align: center;
        }

        /* ===== 作者 — 右下角落款 ===== */
        .author-wrapper {
            position: fixed;
            bottom: clamp(2rem, 4vh, 4rem);
            right: clamp(1.5rem, 4vw, 4rem);
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            pointer-events: auto;
            opacity: 0;
            animation: subtitleFade 4s ease-out 2.2s forwards;
        }

        .author-seal {
            width: clamp(32px, 3.5vw, 48px);
            height: clamp(32px, 3.5vw, 48px);
            border: 2px solid rgba(200, 80, 60, 0.35);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-weight: 700;
            font-size: clamp(0.5rem, 0.7vw, 0.7rem);
            color: rgba(200, 80, 60, 0.35);
            letter-spacing: 0.05em;
            line-height: 1.2;
            text-align: center;
            transform: rotate(-6deg);
            transition: all 0.4s ease;
            background: rgba(200, 80, 60, 0.04);
        }

        .author-seal:hover {
            border-color: rgba(200, 80, 60, 0.6);
            color: rgba(200, 80, 60, 0.6);
            background: rgba(200, 80, 60, 0.08);
            transform: rotate(0deg);
        }

        .author-name {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            font-weight: 700;
            font-size: clamp(0.8rem, 1.2vw, 1.1rem);
            letter-spacing: 0.5em;
            background: linear-gradient(90deg,
                    rgba(255, 215, 120, 0.30),
                    rgba(255, 180, 80, 0.50),
                    rgba(255, 215, 120, 0.30));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.8);
            opacity: 0.7;
        }

        .author-sub {
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-weight: 300;
            font-size: clamp(0.4rem, 0.6vw, 0.55rem);
            color: rgba(255, 215, 120, 0.08);
            letter-spacing: 0.3em;
            margin-top: 0.2rem;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        }

        @keyframes subtitleFade {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 底部版权 ===== */
        .footer {
            position: fixed;
            bottom: clamp(1.2rem, 2vh, 2.4rem);
            left: 0;
            width: 100%;
            z-index: 2;
            text-align: center;
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            font-weight: 300;
            font-size: clamp(0.4rem, 0.6vw, 0.6rem);
            letter-spacing: 0.5em;
            color: rgba(255, 215, 120, 0.04);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
            pointer-events: none;
            animation: subtitleFade 4s ease-out 3s both;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .title {
                letter-spacing: 0.12em;
            }
            .subtitle {
                letter-spacing: 0.5em;
            }
            .author-wrapper {
                bottom: clamp(1.2rem, 2.5vh, 2rem);
                right: clamp(0.8rem, 2vw, 1.5rem);
            }
            .author-seal {
                width: 28px;
                height: 28px;
                font-size: 0.5rem;
            }
        }

        @media (max-width: 480px) {
            .title {
                letter-spacing: 0.06em;
                font-size: clamp(3.8rem, 16vw, 5.5rem);
            }
            .subtitle {
                letter-spacing: 0.3em;
                font-size: clamp(0.6rem, 1.2vw, 0.8rem);
                margin-top: 0.3rem;
            }
            .author-wrapper {
                bottom: 0.8rem;
                right: 0.8rem;
            }
            .author-seal {
                width: 24px;
                height: 24px;
                font-size: 0.4rem;
                border-width: 1px;
            }
            .author-name {
                font-size: 0.65rem;
                letter-spacing: 0.3em;
            }
            .author-sub {
                display: none;
            }
            .divider-top,
            .divider-bottom {
                display: none;
            }
            .footer {
                display: none;
            }
            .content {
                margin-top: -1vh;
            }
        }

        /* ===== 视频降级 ===== */
        .no-video .overlay {
            background: radial-gradient(ellipse at center,
                    #1a100a 0%,
                    #0a0604 80%,
                    #030201 100%);
        }

        /* ===== 悬停彩蛋 ===== */
        @media (hover: hover) {
            .title:hover {
                animation-play-state: paused;
                filter: drop-shadow(0 0 60px rgba(255, 200, 100, 0.20)) drop-shadow(0 0 120px rgba(255, 180, 60, 0.12));
                transition: filter 0.6s ease;
            }
        }
    </style>
</head>

    <script>
        (function() {

            function tryPlay() {
                if (!video) return;
